<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111827">
<title>Seok's Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@700;800&family=Playfair+Display:wght@900&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip" href="#content">본문으로 건너뛰기</a>
<div id="sampleBanner" class="sample-banner" hidden>예시 데이터로 만든 시범 화면입니다. 실제 기사나 시세가 아닙니다.</div>
<header class="masthead">
  <div class="wrap mast-inner">
    <div class="mast-top">
      <span id="dateLabel" class="date-label">불러오는 중</span>
      <button id="calBtn" class="btn-outline cal-btn" type="button" aria-controls="calendarPanel" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>지난 신문</span>
      </button>
    </div>
    <div class="mast-title">
      <h1 class="paper-name"><a href="#/" id="homeLink">Seok's Paper</a></h1>
      <p id="issueLine" class="issue-line"></p>
    </div>
  </div>
</header>
<nav class="tabs-wrap" aria-label="면 이동">
  <div id="tabs" class="wrap tabs" role="tablist"></div>
</nav>

<div class="wrap layout">
  <main id="content" class="content" tabindex="-1" aria-live="polite"></main>
  <aside id="calendarPanel" class="calendar-panel" aria-label="지난 신문 달력">
    <div class="cal-head-row">
      <h2 class="side-title">지난 신문</h2>
      <button type="button" class="btn-ghost cal-close" data-cal-close aria-label="달력 닫기">닫기</button>
    </div>
    <div id="calendar"></div>
    <div id="recent" class="recent"></div>
  </aside>
</div>
<div id="calScrim" class="scrim" data-cal-close hidden></div>

<footer class="wrap site-footer">
  <p>Seok's Paper는 텔레그램, X, 유튜브, 시장 데이터를 매일 아침 정리합니다. 유료 구독 기사는 요지와 원문 링크만 싣습니다. 투자 판단 전에는 원문을 확인하세요.</p>
  <div id="ownerBox" class="owner-box" hidden>
    <span id="ownerText"></span>
    <button id="ownerOff" type="button" class="btn-outline">이 기기에서 전체판 끄기</button>
  </div>
</footer>

<div id="detail" class="detail" hidden>
  <div class="scrim show" data-close></div>
  <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1">
    <div class="detail-bar">
      <button type="button" class="btn-ghost back-btn" data-close>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>목록으로</span>
      </button>
      <span class="bar-name">Seok's Paper</span>
    </div>
    <div id="detailBody" class="detail-body"></div>
  </section>
</div>

<script src="assets/app.js" defer></script>
</body>
</html>
